<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS Designs</title>
<meta name="theme-color" content="#8a1538">
<style>
:root{--c:#8a1538;--bg:#f6f4f5;--card:#fff;--tx:#222;--mut:#777;--ok:#1b8a3b;--warn:#c77700;--line:#e6e1e3}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:72px}
header{background:var(--c);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header b{font-size:18px}
header small{opacity:.85;display:block;font-size:11px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:12px}
main{max-width:820px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:5}
nav button{flex:1;min-width:70px;background:none;border:0;padding:8px 4px;font-size:11px;color:var(--mut)}
nav button span{display:block;font-size:19px}
nav button.on{color:var(--c);font-weight:700}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod img,.prod .ph{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:40px}
.prod h4{margin:8px 0 2px;font-size:15px}
.prod p{margin:2px 0;font-size:12px;color:var(--mut)}
.price{color:var(--c);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
.btn{background:var(--c);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;display:inline-block;text-decoration:none;text-align:center}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.alt{background:#fff;color:var(--c);border:1px solid var(--c)}
.btn.ok{background:var(--ok)}
.btn.red{background:#c0392b}
.btn.w{width:100%}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;margin:4px 0 8px;background:#fff}
label{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.sp{justify-content:space-between}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#eee}
.pill.Placed{background:#fff3cd;color:#8a6d00}.pill.Confirmed{background:#dbeafe;color:#1d4ed8}.pill.Printing{background:#ede9fe;color:#6d28d9}
.pill.Ready{background:#cffafe;color:#0e7490}.pill.Delivered{background:#d1fae5;color:#047857}.pill.Cancelled{background:#fee2e2;color:#b91c1c}
.steps{display:flex;margin:10px 0}
.steps div{flex:1;text-align:center;font-size:10px;color:var(--mut);position:relative}
.steps div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:#ddd;margin:0 auto 4px}
.steps div.done{color:var(--ok);font-weight:700}.steps div.done:before{background:var(--ok)}
.muted{color:var(--mut);font-size:12px}
.center{text-align:center;padding:60px 20px}
.login{max-width:360px;margin:12vh auto;text-align:center;padding:24px}
.login h1{color:var(--c);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:#fff;border-radius:10px;padding:10px;text-align:center;font-size:11px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--c)}
.item{border-top:1px dashed var(--line);padding:8px 0;font-size:13px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,getDoc,onSnapshot,query,where,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= EDIT THESE 5 THINGS ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAph9DCxQrY17NCpSlka8NIlhqwrRD5KU0",
  authDomain: "ks-designs-app.firebaseapp.com",
  projectId: "ks-designs-app",
  appId: "1:846176106696:web:01daa2ee21a5773bc34dfd"
};
const ADMIN_EMAILS = ["kannanmk0807@gmail.com"];   // only these Gmail accounts get admin access
const ADMIN_WHATSAPP = "919994810807";          // your WhatsApp number with 91, no + or spaces
const UPI_ID = "kannanmk0807-4@okaxis";                  // your UPI ID for customer payments
const SHOP_NAME = "KS Designs";
/* ======================================================== */

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const CATS = ["Flex","Frame","Visiting Card","Invitation","Wedding Board","Sunpack Sheet","Vinyl Sticker","Other"];
const STATUSES = ["Placed","Confirmed","Printing","Ready","Delivered","Cancelled"];
const STEPS = ["Placed","Confirmed","Printing","Ready","Delivered"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const sid = id => id.slice(0, 6).toUpperCase();
const when = o => o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('en-IN') : 'just now';
const phoneWA = p => { p = String(p || '').replace(/\D/g, ''); return p.length === 10 ? '91' + p : p; };

let user = null, isAdmin = false, ready = false;
let view = 'shop', cat = 'All', filter = 'All';
let products = [], orders = [], cart = [];
let form = {name:'', phone:'', address:'', notes:''};
let editP = null, pimg = null, lastOrder = null;
try { cart = JSON.parse(localStorage.getItem('ks_cart') || '[]'); } catch (e) {}
const saveCart = () => { try { localStorage.setItem('ks_cart', JSON.stringify(cart)); } catch (e) {} };

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2800); }
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); setTimeout(() => o.stop(), 250); } catch (e) {} }

/* ---------- data ---------- */
onSnapshot(collection(db, 'products'), s => {
  products = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  render();
}, e => console.error(e));

let unsubO = null, firstO = true;
onAuthStateChanged(auth, async u => {
  user = u;
  isAdmin = !!u && ADMIN_EMAILS.some(x => x.toLowerCase() === (u.email || '').toLowerCase());
  if (unsubO) unsubO(); unsubO = null; orders = []; firstO = true;
  if (u) {
    form.name = form.name || u.displayName || '';
    try {
      const s = await getDoc(doc(db, 'users', u.uid));
      if (s.exists()) { const d = s.data(); form.name = d.name || form.name; form.phone = form.phone || d.phone || ''; form.address = form.address || d.address || ''; }
    } catch (e) {}
    const q = isAdmin ? query(collection(db, 'orders'), orderBy('createdAt', 'desc')) : query(collection(db, 'orders'), where('uid', '==', u.uid));
    unsubO = onSnapshot(q, s => {
      if (isAdmin && !firstO) s.docChanges().forEach(c => { if (c.type === 'added') { toast('🔔 New order received!'); beep(); } });
      firstO = false;
      orders = s.docs.map(d => ({id:d.id, ...d.data()}));
      if (!isAdmin) orders.sort((a, b) => (b.createdAt?.seconds || 9e9) - (a.createdAt?.seconds || 9e9));
      render();
    }, e => { console.error(e); toast('Cannot load orders: ' + e.code); });
  }
  ready = true; render();
});

/* ---------- views ---------- */
function loginView() {
  return `<div class="login card"><h1>${esc(SHOP_NAME)}</h1><p class="muted">Flex • Frames • Visiting Cards • Invitations • Wedding Boards • Sunpack • Vinyl</p>
  <p>Order online, track your delivery.</p><button class="btn w" data-a="login">Continue with Google</button></div>`;
}

function shopView() {
  const list = products.filter(p => p.active !== false && (cat === 'All' || p.category === cat));
  return `<div class="chips">${['All', ...CATS].map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-a="cat" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${list.length ? `<div class="grid">${list.map(p => `<div class="card prod">
    ${p.image ? `<img src="${p.image}" alt="">` : `<div class="ph">🖨️</div>`}
    <h4>${esc(p.name)}</h4><p>${esc(p.category)}</p><p>${esc(p.desc)}</p>
    <p class="price">${money(p.price)} / ${esc(p.unit || 'piece')}</p>
    <button class="btn sm w" data-a="add" data-id="${p.id}">Add to cart</button></div>`).join('')}</div>`
  : `<div class="card center">No products here yet.${isAdmin ? '<br>Open the Products tab to add some.' : ''}</div>`}`;
}

function cartView() {
  if (!cart.length) return `<div class="card center">Your cart is empty.<br><br><button class="btn" data-a="nav" data-id="shop">Browse products</button></div>`;
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  return `<div class="card">${cart.map(i => `<div class="item"><div class="row sp"><b>${esc(i.name)}</b><span>${money(i.price * i.qty)}</span></div>
    <div class="row"><button class="btn sm alt" data-a="qty" data-id="${i.pid}" data-d="-1">−</button><b>${i.qty} ${esc(i.unit)}</b><button class="btn sm alt" data-a="qty" data-id="${i.pid}" data-d="1">+</button>
    <button class="btn sm red" data-a="rm" data-id="${i.pid}">Remove</button></div>
    <input placeholder="Size / text / design details (e.g. 6x4 ft, name, photo)" value="${esc(i.note || '')}" data-i="note:${i.pid}"></div>`).join('')}
    <div class="row sp"><b>Estimated total</b><b class="price">${money(total)}</b></div>
    <p class="muted">Final amount for custom sizes will be confirmed by ${esc(SHOP_NAME)}.</p></div>
  <form class="card" data-f="order">
    <label>Your name</label><input name="name" required value="${esc(form.name)}" data-i="name">
    <label>Phone number</label><input name="phone" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" value="${esc(form.phone)}" data-i="phone">
    <label>Delivery address</label><textarea name="address" rows="2" required data-i="address">${esc(form.address)}</textarea>
    <label>Extra notes (optional)</label><textarea name="notes" rows="2" data-i="notes">${esc(form.notes)}</textarea>
    <button class="btn w" type="submit">Place order</button></form>`;
}

function successView() {
  const o = lastOrder; if (!o) return '';
  const wa = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(waText(o))}`;
  return `<div class="card center"><div style="font-size:48px">✅</div><h3>Order placed!</h3><p>Order ID: <b>${sid(o.id)}</b></p>
  <p class="muted">${esc(SHOP_NAME)} will confirm your order and final amount shortly.</p>
  <p><a class="btn ok w" href="${wa}" target="_blank" rel="noopener">Send order on WhatsApp</a></p>
  <p><a class="btn w" href="${upiLink(o)}">Pay ${money(o.total)} by UPI</a></p>
  <p><button class="btn alt w" data-a="nav" data-id="orders">View my orders</button></p></div>`;
}

const waText = o => `New order ${sid(o.id)}\nName: ${o.name}\nPhone: ${o.phone}\n` + o.items.map(i => `• ${i.name} x ${i.qty} ${i.unit}${i.note ? ' (' + i.note + ')' : ''}`).join('\n') + `\nTotal: ${money(o.total)}\nAddress: ${o.address}`;
const upiLink = o => `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(SHOP_NAME)}&am=${o.total}&cu=INR&tn=${encodeURIComponent('Order ' + sid(o.id))}`;

function itemsHtml(o) { return o.items.map(i => `<div class="item">${esc(i.name)} × ${i.qty} ${esc(i.unit)} — ${money(i.price * i.qty)}${i.note ? `<div class="muted">${esc(i.note)}</div>` : ''}</div>`).join(''); }
function stepsHtml(o) {
  if (o.status === 'Cancelled') return '';
  const idx = STEPS.indexOf(o.status);
  return `<div class="steps">${STEPS.map((s, i) => `<div class="${i <= idx ? 'done' : ''}">${s}</div>`).join('')}</div>`;
}
const payText = o => o.payStatus === 'Confirmed' ? '<span class="pill Delivered">Payment confirmed</span>' : o.payStatus === 'Submitted' ? '<span class="pill Placed">Payment being verified</span>' : '<span class="pill Cancelled">Payment pending</span>';

function ordersView() {
  if (!orders.length) return `<div class="card center">No orders yet.</div>`;
  return orders.map(o => `<div class="card"><div class="row sp"><b>#${sid(o.id)}</b><span class="pill ${o.status}">${o.status}</span></div>
    <div class="muted">${when(o)}</div>${stepsHtml(o)}${itemsHtml(o)}
    <div class="row sp"><b>Total</b><b class="price">${money(o.total)}</b></div><div style="margin:8px 0">${payText(o)}</div>
    ${o.payStatus === 'Pending' && o.status !== 'Cancelled' ? `<a class="btn w" href="${upiLink(o)}">Pay ${money(o.total)} by UPI</a>
      <label>After paying, enter UPI reference / transaction ID</label><input id="ref-${o.id}" placeholder="12 digit UTR number">
      <button class="btn alt w" data-a="paid" data-id="${o.id}">I have paid</button>` : ''}
    ${o.status === 'Delivered' ? (o.feedback ? `<div class="item"><b>Your feedback:</b> ${'⭐'.repeat(o.feedback.rating)}<div class="muted">${esc(o.feedback.text)}</div></div>`
      : `<div class="item"><b>How was your order?</b><select id="rt-${o.id}"><option value="5">⭐⭐⭐⭐⭐ Excellent</option><option value="4">⭐⭐⭐⭐ Good</option><option value="3">⭐⭐⭐ Okay</option><option value="2">⭐⭐ Poor</option><option value="1">⭐ Bad</option></select>
      <textarea id="fb-${o.id}" rows="2" placeholder="Write your feedback"></textarea><button class="btn w" data-a="feedback" data-id="${o.id}">Submit feedback</button></div>`) : ''}
  </div>`).join('');
}

function aOrdersView() {
  const n = s => orders.filter(o => o.status === s).length;
  const verify = orders.filter(o => o.payStatus === 'Submitted').length;
  const list = orders.filter(o => filter === 'All' || o.status === filter);
  return `<div class="stats"><div><b>${n('Placed')}</b>New</div><div><b>${orders.filter(o => ['Confirmed','Printing','Ready'].includes(o.status)).length}</b>In progress</div><div><b>${verify}</b>Verify payment</div></div>
  <select data-c="filter"><option>All</option>${STATUSES.map(s => `<option ${s === filter ? 'selected' : ''}>${s}</option>`).join('')}</select>
  ${list.length ? list.map(o => `<div class="card"><div class="row sp"><b>#${sid(o.id)}</b><span class="pill ${o.status}">${o.status}</span></div>
    <div class="muted">${when(o)}</div>
    <div class="item"><b>${esc(o.name)}</b> • ${esc(o.phone)}<div class="muted">${esc(o.email)}</div><div>${esc(o.address)}</div>${o.notes ? `<div class="muted">Note: ${esc(o.notes)}</div>` : ''}
      <div class="row" style="margin-top:6px"><a class="btn sm alt" href="tel:${esc(o.phone)}">Call</a><a class="btn sm ok" target="_blank" rel="noopener" href="https://wa.me/${phoneWA(o.phone)}?text=${encodeURIComponent('Hi ' + o.name + ', regarding your ' + SHOP_NAME + ' order #' + sid(o.id))}">WhatsApp</a></div></div>
    ${itemsHtml(o)}
    <label>Final amount (₹)</label><div class="row"><input id="tot-${o.id}" type="number" value="${o.total}" style="width:140px;margin:0"><button class="btn sm" data-a="saveTotal" data-id="${o.id}">Save amount</button></div>
    <label style="display:block;margin-top:8px">Delivery status</label>
    <select data-c="status" data-id="${o.id}">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <div class="row sp">${payText(o)}${o.payRef ? `<span class="muted">Ref: ${esc(o.payRef)}</span>` : ''}</div>
    <div class="row" style="margin-top:6px"><button class="btn sm ok" data-a="payok" data-id="${o.id}">Confirm payment</button><button class="btn sm alt" data-a="paynot" data-id="${o.id}">Mark pending</button><button class="btn sm red" data-a="delorder" data-id="${o.id}">Delete</button></div>
    ${o.feedback ? `<div class="item"><b>Feedback:</b> ${'⭐'.repeat(o.feedback.rating)}<div class="muted">${esc(o.feedback.text)}</div></div>` : ''}
  </div>`).join('') : `<div class="card center">No orders.</div>`}`;
}

function aProductsView() {
  const p = editP ? products.find(x => x.id === editP) : null;
  return `<form class="card" data-f="product"><b>${p ? 'Edit product' : 'Add product'}</b><br>
    <label>Name</label><input name="name" required value="${esc(p?.name)}">
    <label>Category</label><select name="category">${CATS.map(c => `<option ${p?.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <label>Price (₹)</label><input name="price" type="number" step="0.01" min="0" required value="${p ? p.price : ''}">
    <label>Unit (sq ft, piece, 100 cards...)</label><input name="unit" value="${esc(p?.unit || 'piece')}">
    <label>Description</label><textarea name="desc" rows="2">${esc(p?.desc)}</textarea>
    <label>Photo ${p?.image ? '(leave empty to keep current)' : ''}</label><input type="file" accept="image/*" data-c="pimg"><span class="muted" id="pimgst"></span>
    <label><input type="checkbox" name="active" style="width:auto" ${!p || p.active !== false ? 'checked' : ''}> Visible to customers</label><br>
    <button class="btn w" type="submit">${p ? 'Save changes' : 'Add product'}</button>${p ? '<br><br><button class="btn alt w" type="button" data-a="cancelEdit">Cancel</button>' : ''}</form>
  ${products.map(x => `<div class="card"><div class="row sp"><div><b>${esc(x.name)}</b>${x.active === false ? ' <span class="pill Cancelled">Hidden</span>' : ''}<div class="muted">${esc(x.category)} • ${money(x.price)} / ${esc(x.unit)}</div></div>
    <div class="row"><button class="btn sm alt" data-a="editp" data-id="${x.id}">Edit</button><button class="btn sm red" data-a="delp" data-id="${x.id}">Delete</button></div></div></div>`).join('')}`;
}

function render() {
  const el = $('#app');
  if (!ready) { el.innerHTML = '<div class="center">Loading…</div>'; return; }
  if (!user) { el.innerHTML = loginView(); return; }
  if (!isAdmin && view.startsWith('a')) view = 'shop';
  const cn = cart.reduce((n, i) => n + i.qty, 0), newO = orders.filter(o => o.status === 'Placed').length;
  const tabs = [['shop','🛍️','Shop'], ['cart','🛒','Cart' + (cn ? ` (${cn})` : '')], ['orders','📦','My Orders']];
  if (isAdmin) tabs.push(['aorders','📋','Orders' + (newO ? ` (${newO})` : '')], ['aproducts','🏷️','Products']);
  const body = {shop:shopView, cart:cartView, orders:ordersView, success:successView, aorders:aOrdersView, aproducts:aProductsView}[view]();
  el.innerHTML = `<header><div><b>${esc(SHOP_NAME)}</b><small>${esc(user.displayName || user.email)}${isAdmin ? ' • ADMIN' : ''}</small></div><button data-a="logout">Logout</button></header>
  <main>${body}</main><nav>${tabs.map(t => `<button class="${t[0] === view ? 'on' : ''}" data-a="nav" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
}

/* ---------- actions ---------- */
const upd = (id, data) => updateDoc(doc(db, 'orders', id), data);
const actions = {
  login: () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast('Login failed: ' + e.code)),
  logout: () => signOut(auth),
  nav: id => { view = id; render(); window.scrollTo(0, 0); },
  cat: id => { cat = id; render(); },
  add: id => {
    const p = products.find(x => x.id === id); if (!p) return;
    const it = cart.find(x => x.pid === id);
    if (it) it.qty++; else cart.push({pid:id, name:p.name, price:Number(p.price), unit:p.unit || 'piece', qty:1, note:''});
    saveCart(); render(); toast('Added to cart');
  },
  qty: (id, t) => { const it = cart.find(x => x.pid === id); if (!it) return; it.qty += Number(t.dataset.d); if (it.qty < 1) it.qty = 1; saveCart(); render(); },
  rm: id => { cart = cart.filter(x => x.pid !== id); saveCart(); render(); },
  paid: async id => { const v = ($('#ref-' + id).value || '').trim(); if (v.length < 6) return toast('Enter the UPI reference number'); await upd(id, {payRef:v, payStatus:'Submitted'}); toast('Sent for verification'); },
  feedback: async id => { await upd(id, {feedback:{rating:Number($('#rt-' + id).value), text:($('#fb-' + id).value || '').trim()}}); toast('Thank you!'); },
  saveTotal: async id => { const v = Number($('#tot-' + id).value); if (!(v >= 0)) return toast('Enter a valid amount'); await upd(id, {total:v}); toast('Amount saved'); },
  payok: async id => { await upd(id, {payStatus:'Confirmed'}); toast('Payment confirmed'); },
  paynot: async id => { await upd(id, {payStatus:'Pending'}); },
  delorder: async id => { if (confirm('Delete this order permanently?')) await deleteDoc(doc(db, 'orders', id)); },
  editp: id => { editP = id; pimg = null; render(); window.scrollTo(0, 0); },
  cancelEdit: () => { editP = null; pimg = null; render(); },
  delp: async id => { if (confirm('Delete this product?')) await deleteDoc(doc(db, 'products', id)); }
};
const changes = {
  status: async (id, t) => { await upd(id, {status:t.value}); toast('Status: ' + t.value); },
  filter: (id, t) => { filter = t.value; render(); },
  pimg: async (id, t) => {
    const f = t.files[0]; if (!f) return;
    pimg = await resize(f); $('#pimgst').textContent = ' Photo ready ✔';
  }
};
const forms = {
  order: async () => {
    if (!cart.length) return toast('Cart is empty');
    if (!/^\d{10}$/.test(form.phone)) return toast('Enter a 10 digit phone number');
    const items = cart.map(i => ({pid:i.pid, name:i.name, price:i.price, unit:i.unit, qty:i.qty, note:i.note || ''}));
    const total = items.reduce((s, i) => s + i.price * i.qty, 0);
    const data = {uid:user.uid, email:user.email, name:form.name.trim(), phone:form.phone, address:form.address.trim(), notes:form.notes.trim(), items, total, status:'Placed', payStatus:'Pending', payRef:'', createdAt:serverTimestamp()};
    const ref = await addDoc(collection(db, 'orders'), data);
    try { await setDoc(doc(db, 'users', user.uid), {name:data.name, phone:data.phone, address:data.address, email:user.email}, {merge:true}); } catch (e) {}
    lastOrder = {id:ref.id, ...data}; cart = []; form.notes = ''; saveCart(); view = 'success'; render();
  },
  product: async f => {
    const fd = new FormData(f);
    const data = {name:fd.get('name').trim(), category:fd.get('category'), price:Number(fd.get('price')), unit:(fd.get('unit') || '').trim() || 'piece', desc:(fd.get('desc') || '').trim(), active:fd.get('active') === 'on'};
    if (!data.name || !(data.price >= 0)) return toast('Name and price needed');
    if (pimg) data.image = pimg;
    if (editP) { await updateDoc(doc(db, 'products', editP), data); toast('Product updated'); }
    else { data.createdAt = serverTimestamp(); await addDoc(collection(db, 'products'), data); toast('Product added'); }
    editP = null; pimg = null; render();
  }
};

const resize = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', .72)); }; im.onerror = rej; im.src = r.result; };
  r.onerror = rej; r.readAsDataURL(file);
});

const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { console.error(e); toast(e.code === 'permission-denied' ? 'Not allowed (check Firestore rules)' : (e.message || 'Something went wrong')); } };
document.addEventListener('click', guard(async e => { const t = e.target.closest('[data-a]'); if (t && actions[t.dataset.a]) await actions[t.dataset.a](t.dataset.id, t); }));
document.addEventListener('change', guard(async e => { const t = e.target.closest('[data-c]'); if (t && changes[t.dataset.c]) await changes[t.dataset.c](t.dataset.id, t); }));
document.addEventListener('input', e => {
  const k = e.target.dataset?.i; if (!k) return;
  if (k.startsWith('note:')) { const it = cart.find(x => x.pid === k.slice(5)); if (it) { it.note = e.target.value; saveCart(); } }
  else form[k] = e.target.value;
});
document.addEventListener('submit', guard(async e => { const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault(); await forms[f.dataset.f](f); }));
render();
</script>
</body>
</html>
